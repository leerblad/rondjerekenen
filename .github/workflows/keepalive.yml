name: Supabase Keepalive

on:
  schedule:
    - cron: "0 8 */5 * *"  # elke 5 dagen om 08:00 UTC
  workflow_dispatch:        # ook handmatig te starten

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -s \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/students?select=id&limit=1" \
            > /dev/null
          echo "Supabase keepalive gestuurd"
